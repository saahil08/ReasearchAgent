[project]
name = "researchagent-langchain-practise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "dotenv>=0.9.9",
    "google-genai>=2.32.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.0.0",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.7.2",
    "langfuse>=5.0.2",
    "langgraph-checkpoint-aws>=1.2.6",
    "python-dotenv>=1.1.0",
    "tavily>=1.1.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
researchagent-langchain-practise = "researchagent_langchain_practise:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
